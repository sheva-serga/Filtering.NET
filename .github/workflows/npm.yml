name: npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version (e.g. 0.3.0)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish to npmjs.org
        run: |
          case "${{ steps.ver.outputs.version }}" in
            *-*) DIST_TAG=next ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "Publishing with dist-tag: $DIST_TAG"
          npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
