site_name: Filtering.Net
site_url: https://sheva-serga.github.io/Filtering.NET/
site_description: Type-safe, source-generated filter / sort / page library for IQueryable<T> and EF Core.
site_author: Serhii Shevchenko

repo_url: https://github.com/sheva-serga/Filtering.NET
repo_name: sheva-serga/Filtering.NET
edit_uri: edit/main/docs/github/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first filter: getting-started/your-first-filter.md
      - DI registration: getting-started/di-registration.md
      - Your first request: getting-started/your-first-request.md
  - Concepts:
      - How it works: concepts/how-it-works.md
      - The FilterRequest JSON shape: concepts/filter-request-shape.md
      - Profiles and operators: concepts/profiles-and-operators.md
      - Validation philosophy: concepts/validation-philosophy.md
  - Guides:
      - Mapping properties: guides/mapping-properties.md
      - Sortable properties: guides/sortable-properties.md
      - Restricting operators: guides/restricting-operators.md
      - Built-in profiles: guides/built-in-profiles.md
      - Custom profiles + operators: guides/custom-profiles.md
      - Per-property override (PropertyMap): guides/property-map-overrides.md
      - Intercepting values: guides/intercepting-values.md
      - Value conversion: guides/value-conversion.md
      - Filtering enums: guides/filtering-enums.md
      - Navigation paths and aliases: guides/navigation-paths.md
      - Page settings: guides/page-settings.md
      - DI integration: guides/di-integration.md
      - Async paged queries: guides/async-paged-queries.md
      - Handling validation errors: guides/handling-validation-errors.md
      - Trim / AOT-clean setup: guides/aot-clean-setup.md
      - Testing filter classes: guides/testing-filter-classes.md
  - Reference:
      - Attributes:
          - "[GenerateFilter<T>]": reference/attributes/generate-filter.md
          - "[Map]": reference/attributes/map.md
          - "[PropertyMap]": reference/attributes/property-map.md
          - "[FilterProfile<T>]": reference/attributes/filter-profile.md
          - "[FilterOperator]": reference/attributes/filter-operator.md
          - "[FilterValidator]": reference/attributes/filter-validator.md
          - "[InterceptValue]": reference/attributes/intercept-value.md
          - "[ConvertWith<TConverter>]": reference/attributes/convert-with.md
          - "[FilterDefaults]": reference/attributes/filter-defaults.md
          - "[PageSettings]": reference/attributes/page-settings.md
      - Request types:
          - FilterRequest: reference/types/filter-request.md
          - FilterNode (FilterGroup, FilterLeaf): reference/types/filter-node.md
          - SortItem / SortDir / LogicalOp: reference/types/sort-item.md
      - Validation types:
          - FilterValidationResult: reference/types/filter-validation-result.md
          - FilterValidationError: reference/types/filter-validation-error.md
          - FilterValidationCode: reference/types/filter-validation-code.md
      - Core interfaces and helpers:
          - "IFilterDefinition<T>": reference/types/i-filter-definition.md
          - "IQueryable<T>.Apply": reference/types/apply-extension.md
          - "IQueryable<T>.ApplyPagedAsync": reference/types/apply-paged-async.md
          - "PageResult<T>": reference/types/page-result.md
      - Diagnostics:
          - Catalogue: reference/diagnostics/index.md
          - "FN0001 — DuplicateMap": reference/diagnostics/FN0001.md
          - "FN0002 — DuplicateSortable": reference/diagnostics/FN0002.md
          - "FN0003 — MapAndPropertyMapBoth": reference/diagnostics/FN0003.md
          - "FN0004 — PropertyNotFound": reference/diagnostics/FN0004.md
          - "FN0005 — IncompatibleProfile": reference/diagnostics/FN0005.md
          - "FN0006 — UnknownOperator": reference/diagnostics/FN0006.md
          - "FN0007 — InvalidValueConverter": reference/diagnostics/FN0007.md
          - "FN0008 — MissingPartial": reference/diagnostics/FN0008.md
          - "FN0009 — NoInferableProfile": reference/diagnostics/FN0009.md
          - "FN0010 — DuplicateInterceptor": reference/diagnostics/FN0010.md
          - "FN0011 — NonStaticOperator": reference/diagnostics/FN0011.md
          - "FN0012 — AliasCollision": reference/diagnostics/FN0012.md
          - "FN0013 — InvalidBaseProfile": reference/diagnostics/FN0013.md
          - "FN0014 — InterceptorWithoutMap": reference/diagnostics/FN0014.md
